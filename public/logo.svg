<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Miles for Migrant Workers</title>
  <!-- the hoarding panel, its seam, and the walkway the bike rides on -->
  <rect width="64" height="64" fill="#A32135"/>
  <rect x="0" y="50" width="64" height="2" fill="#5E1420"/>
  <rect x="0" y="52" width="64" height="12" fill="#1C1D1F"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- wheels -->
    <circle cx="16" cy="38" r="10"/>
    <circle cx="48" cy="38" r="10"/>
    <!-- frame: chain stay, seat stay, seat tube, top tube, down tube, fork -->
    <path d="M16 38 L30 38 L24 22 Z"/>
    <path d="M24 22 L43 22 L30 38"/>
    <path d="M43 22 L48 38"/>
    <!-- saddle and handlebar -->
    <path d="M20 20 L28 20"/>
    <path d="M43 22 L41 16 L47 16"/>
  </g>
  <!-- crank -->
  <circle cx="30" cy="38" r="3" fill="#FFFFFF"/>
</svg>
